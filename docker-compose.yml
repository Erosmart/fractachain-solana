# Local stand-in for the two Railway services.
#   docker compose up --build
#
# The UI talks to the API at localhost:8080 from the browser.
# For a public Railway URL, rebuild the frontend with that URL as NEXT_PUBLIC_API_URL.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: backend/.env
        required: false
    environment:
      PORT: "8080"
      NODE_ENV: production
      SOLANA_CLUSTER: ${SOLANA_CLUSTER:-devnet}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      SOLANA_AUTO_FAUCET: ${SOLANA_AUTO_FAUCET:-false}
      HACKATHON_DEMO: ${HACKATHON_DEMO:-true}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
