[toolchain]
anchor_version = "1.2.0"
# Must match `solana --version` on PATH, or anchor tries agave-install to switch.
solana_version = "4.3.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
fractachain = "Fractachain111111111111111111111111111111111"

[programs.localnet]
fractachain = "Fractachain111111111111111111111111111111111"

[registry]
url = "https://api.devnet.solana.com"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[test]
startup_wait = 10000

[scripts]
test = "cargo test"
